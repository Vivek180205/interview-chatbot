spring.application.name=InterviewChatbot

spring.datasource.url=jdbc:postgresql://localhost:5432/Interview_Chatbot
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

#Queries

user.query.Login = Select * from users where email = ?;
user.query.SignUp = Insert INTO users(name, email, password, target_role, experience_level) values (?,?,?,?,?);
user.query.findByEmailQuery = SELECT * FROM users WHERE email = ?;

chat.query.store = Insert INTO chat_messages(session_id, sender, message, score) values (?,?,?,?);
chat.query.fetch = Select * from chat_messages where session_id = ? ORDER BY created_at ASC;

session.query.store = Insert INTO interview_sessions (user_id, category, average_score, completed, created_at) values (?,?,?,?,?);
session.query.getAvgScore = SELECT AVG(score) FROM chat_messages WHERE session_id = ? AND score IS NOT NULL;
session.query.completed =  UPDATE interview_sessions SET average_score = ?, completed = ?, ended_at = ? WHERE id = ?;